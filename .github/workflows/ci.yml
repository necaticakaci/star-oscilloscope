# SPDX-License-Identifier: GPL-3.0-or-later
# Builds and tests on Debian 13, Ubuntu 24.04 and Windows and makes the packages (docs/building.md §1.3). Each Linux
# package is built in its own distribution's container, against that distribution's libraries. A tag such as v0.7.0
# attaches the packages to a draft release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LINUX_PACKAGES: >-
    build-essential cmake ninja-build pkg-config dpkg-dev file libusb-1.0-0-dev catch2 qt6-base-dev
    qt6-base-dev-tools qt6-tools-dev qt6-l10n-tools qt6-translations-l10n libgl-dev fonts-dejavu-core

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13
            distro: debian13
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            distro: ubuntu24.04
    steps:
      - name: Install the build tools and libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git $LINUX_PACKAGES
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTAROSC_PACKAGE_DISTRO=${{ matrix.distro }}
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package
        run: cpack --config build/CPackConfig.cmake -B packages
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.distro }}
          path: packages/*.deb
          if-no-files-found: error

  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    # The oldest base the code builds on (GCC 13 for std::format): the AppImage runs on it and anything newer.
    container: ubuntu:24.04
    steps:
      - name: Install the build tools and libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git $LINUX_PACKAGES qt6-wayland
      - uses: actions/checkout@v7
      - name: Get linuxdeploy (versions and checksums as in docs/building.md §1.3)
        run: |
          mkdir -p "$HOME/tools/linuxdeploy" && cd "$HOME/tools/linuxdeploy"
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          printf '%s\n' \
            'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage' \
            '15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage' \
            | sha256sum -c -
          chmod +x ./*.AppImage
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTAROSC_BUILD_TESTS=OFF
          cmake --build build --target star-oscilloscope
      - name: Make the AppImage
        run: |
          mkdir -p packages
          bash packaging/linux/appimage.sh build packages
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: packages/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-libusb mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools mingw-w64-ucrt-x86_64-qt6-translations mingw-w64-ucrt-x86_64-catch
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package
        run: cpack --config build/CPackConfig.cmake -B packages
      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: packages/*.zip
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, appimage, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the project's version
        run: |
          version=$(sed -n 's/^project(StarOscilloscope VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, project version $version"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd packages && sha256sum -- * > SHA256SUMS.txt)
          version=${GITHUB_REF_NAME#v}
          # The version's section of the changelog. GitHub keeps line breaks in release notes, so the lines a paragraph
          # or list item is wrapped into are joined back into one.
          awk -v v="$version" 'index($0, "## " v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md \
            | awk '{ if ($0 != "" && prev != "" && $0 !~ /^[[:space:]]*(#+|[-*]|[0-9]+\.) /) { sub(/^[[:space:]]+/, ""); buf = buf " " $0 }
                     else { if (NR > 1) print buf; buf = $0 }
                     prev = $0 }
                   END { print buf }' > notes.md
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Star Oscilloscope $version" --notes-file notes.md
